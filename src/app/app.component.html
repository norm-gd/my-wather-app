<main>
  <div [ngClass]="{ 'centered': fahrenheit === null }" class="search-container">
    <p class="heading" *ngIf="fahrenheit === null">City Weather & Location</p>

    <div class="input-group">
      <input
        type="text"
        #cityName
        placeholder="Enter a US city"
        (keydown)="onKeyDownEvent($event)"
        [disabled]="loading"
      />
      <button
        type="button"
        class="primary"
        (click)="onSubmit()"
        [disabled]="loading"
      >
        {{ loading ? '' : 'Get Forecast' }}
      </button>
      <button
        type="button"
        class="secondary"
        (click)="clearData()"
        *ngIf="fahrenheit !== null"
        [disabled]="loading"
      >
        Clear
      </button>
    </div>

    <div *ngIf="inputError" class="inline-error">{{ inputError }}</div>

    <div *ngIf="loading" class="loading">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>

    <div *ngIf="geoResults.length" class="suggestion-list">
      <p class="suggestion-hint">Multiple matches found — choose one:</p>
      <button
        type="button"
        class="suggestion-item"
        *ngFor="let r of geoResults"
        (click)="selectGeo(r)"
      >
        {{ r.name }}{{ r.state ? ', ' + r.state : '' }}, {{ r.country }}
      </button>
    </div>
  </div>

  <div *ngIf="fahrenheit !== null" class="weather-card">
    <div class="weather-header">
      <h2 class="city-name">{{ displayCityName }}</h2>
      <p class="temperature">{{ fahrenheit }}°F</p>
    </div>

    <div class="weather-details">
      <div class="detail-item">
        <span class="detail-label">Humidity</span>
        <span class="detail-value">{{ humidity }}%</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Feels Like</span>
        <span class="detail-value">{{ feelsLike }}°F</span>
      </div>
    </div>
  </div>

  <div
    id="map"
    leaflet
    (leafletMapReady)="onMapReady($event)"
    [leafletOptions]="mapOptions"
    *ngIf="fahrenheit !== null"
  ></div>

  <div class="error-message" [ngClass]="{ 'show-error': error }">
    {{ errorMessage }}
  </div>
</main>
